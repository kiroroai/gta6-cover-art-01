<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Boulevard — GTA-style Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor controls">
    <h1>Neon Boulevard</h1>
    <p class="tagline">Your photo + a caption, made into GTA-style cover art. Photos never leave your machine.</p>

    <fieldset>
      <legend>1 · Photos</legend>
      <div class="slot">
        <span class="slot-name">Photo 1</span>
        <input id="photo-1" type="file" accept="image/*" aria-label="Photo 1">
        <button id="sample-1" type="button" class="mini">Sample</button>
        <span id="slot-1-state" class="slot-state">Empty</span>
      </div>
      <div class="slot">
        <span class="slot-name">Photo 2</span>
        <input id="photo-2" type="file" accept="image/*" aria-label="Photo 2">
        <button id="sample-2" type="button" class="mini">Sample</button>
        <span id="slot-2-state" class="slot-state">Empty</span>
      </div>
      <div class="slot">
        <span class="slot-name">Photo 3</span>
        <input id="photo-3" type="file" accept="image/*" aria-label="Photo 3">
        <button id="sample-3" type="button" class="mini">Sample</button>
        <span id="slot-3-state" class="slot-state">Empty</span>
      </div>
      <button id="load-samples" type="button" class="mini">Load both sample photos</button>
    </fieldset>

    <fieldset>
      <legend>2 · Layout &amp; panels</legend>
      <div id="layout-picker" class="picker" role="group" aria-label="Panel layout">
        <button type="button" data-value="trio" class="active">Trio</button>
        <button type="button" data-value="duo">Duo</button>
        <button type="button" data-value="hero">Hero</button>
        <button type="button" data-value="quad">Grid</button>
      </div>
      <p class="hint">Click a panel on the cover to select it, then crop it below.</p>
      <div class="panel-editor">
        <strong id="panel-label">Panel 1 of 3</strong>
        <label>Photo in this panel
          <select id="panel-photo">
            <option value="0">Photo 1</option>
            <option value="1">Photo 2</option>
            <option value="2">Photo 3</option>
            <option value="none">None (sunset scene)</option>
          </select>
        </label>
        <div class="sliders">
          <label>Zoom <span id="zoom-value">1.00x</span>
            <input id="panel-zoom" type="range" min="1" max="2.5" step="0.05" value="1">
          </label>
          <label>Left–right <span id="x-value">50%</span>
            <input id="panel-x" type="range" min="0" max="1" step="0.01" value="0.5">
          </label>
          <label>Up–down <span id="y-value">50%</span>
            <input id="panel-y" type="range" min="0" max="1" step="0.01" value="0.5">
          </label>
        </div>
        <button id="fill-all" type="button" class="mini">Fill every panel with this photo</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>3 · Words</legend>
      <div class="two-col">
        <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
        <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="Neon Nights • Est. 2026"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>4 · Grade, size &amp; export</legend>
      <div id="grade-picker" class="picker" role="group" aria-label="Colour grade">
        <button type="button" data-value="sunset" class="active">Sunset</button>
        <button type="button" data-value="neon">Neon</button>
        <button type="button" data-value="night">Night</button>
        <button type="button" data-value="gold">Gold</button>
      </div>
      <div id="size-picker" class="picker" role="group" aria-label="Export size">
        <button type="button" data-value="square">1080 × 1080</button>
        <button type="button" data-value="portrait">1080 × 1350</button>
        <button type="button" data-value="landscape" class="active">1920 × 1080</button>
      </div>
      <button id="export" type="button" class="export">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>

  <section class="stage" aria-label="Live cover preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
